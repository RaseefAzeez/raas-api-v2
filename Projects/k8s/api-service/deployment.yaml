apiVersion: apps/v1
kind: Deployment
metadata:
  name: raas-api-deployment
  namespace: default
  labels:
    app: raas-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: raas-api
  template:
    metadata:
      labels:
        app: raas-api
    spec:
      containers:
        - name: api-service
          image: projects-api-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: api-port
          envFrom:
            - configMapRef:
                name: raas-api-config
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          envFrom:
            - configMapRef:
                name: raas-api-config